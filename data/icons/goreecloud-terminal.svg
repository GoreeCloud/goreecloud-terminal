<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Terminal</title>
  <desc id="desc">A Glaze UI inspired terminal window within a cloud silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102342"/>
      <stop offset="0.55" stop-color="#173B77"/>
      <stop offset="1" stop-color="#0B172D"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="96" x2="392" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE7FF"/>
