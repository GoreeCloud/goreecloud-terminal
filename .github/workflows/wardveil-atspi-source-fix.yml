name: Wardveil AT-SPI Source Fix

on:
  push:
    branches:
      - agent/wardveil-atspi-accessibility-fix
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/wardveil-atspi-accessibility-fix
          fetch-depth: 0

      - name: Normalize Wardveil accessibility semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/ptyxis-window-dressing.c")
          text = path.read_text(encoding="utf-8")
          original = text

          if "gtk_image_new ()" in text:
              text = text.replace(
                  "  self->session_context_icon = GTK_IMAGE (gtk_image_new ());",
                  "  self->session_context_icon = GTK_IMAGE (g_object_new (GTK_TYPE_IMAGE,\n"
                  "                                                       \"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE,\n"
                  "                                                       NULL));",
                  1,
              )

          if "gtk_label_new (NULL)" in text:
              text = text.replace(
                  "  self->session_context_label = GTK_LABEL (gtk_label_new (NULL));",
                  "  self->session_context_label = GTK_LABEL (g_object_new (GTK_TYPE_LABEL,\n"
                  "                                                       \"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE,\n"
                  "                                                       NULL));",
                  1,
              )

          chip_pattern = re.compile(
              r'(  self->session_context_chip = g_object_new \(GTK_TYPE_BOX,\n)'
              r'(?:[ \t]+\"accessible-role\", GTK_ACCESSIBLE_ROLE_GROUP,\n)*'
          )
          text, count = chip_pattern.subn(
              r'\1                                              "accessible-role", GTK_ACCESSIBLE_ROLE_GROUP,\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected one Wardveil session-context chip constructor, found {count}")

          if text.count('"accessible-role", GTK_ACCESSIBLE_ROLE_GROUP') != 1:
              raise SystemExit("Wardveil chip must contain exactly one semantic group role")
          if text.count('"accessible-role", GTK_ACCESSIBLE_ROLE_NONE') != 2:
              raise SystemExit("Wardveil decorative children must contain exactly two non-semantic roles")

          if text != original:
              path.write_text(text, encoding="utf-8")
          else:
              print("Wardveil AT-SPI source semantics already normalized")
          PY

          python3 tools/test-wardveil-accessibility-contract.py

      - name: Commit source fix when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/ptyxis-window-dressing.c; then
            echo "No source commit required"
            exit 0
          fi
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ptyxis-window-dressing.c
          git diff --cached --check
          git commit -m "Normalize Wardveil AT-SPI accessible semantics"
          git push origin HEAD:agent/wardveil-atspi-accessibility-fix
