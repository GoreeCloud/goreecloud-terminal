name: Wardveil AT-SPI Source Fix

on:
  push:
    branches:
      - agent/wardveil-atspi-accessibility-fix
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/wardveil-atspi-accessibility-fix
          fetch-depth: 0

      - name: Apply exact Wardveil accessibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ptyxis-window-dressing.c")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  self->session_context_icon = GTK_IMAGE (gtk_image_new ());",
                  "  self->session_context_icon = GTK_IMAGE (g_object_new (GTK_TYPE_IMAGE,\n"
                  "                                                       \"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE,\n"
                  "                                                       NULL));",
                  "decorative icon role",
              ),
              (
                  "  self->session_context_label = GTK_LABEL (gtk_label_new (NULL));",
                  "  self->session_context_label = GTK_LABEL (g_object_new (GTK_TYPE_LABEL,\n"
                  "                                                                 \"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE,\n"
                  "                                                                 NULL));",
                  "decorative label role",
              ),
              (
                  "  self->session_context_chip = g_object_new (GTK_TYPE_BOX,\n",
                  "  self->session_context_chip = g_object_new (GTK_TYPE_BOX,\n"
                  "                                              \"accessible-role\", GTK_ACCESSIBLE_ROLE_GROUP,\n",
                  "semantic group role",
              ),
          ]

          changed = False
          for old, new, description in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected one {description} source pattern, found {text.count(old)}")
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"neither old nor corrected {description} source pattern was found")

          if changed:
              path.write_text(text, encoding="utf-8")
          else:
              print("Wardveil AT-SPI source fix is already applied")
          PY

          python3 tools/test-wardveil-accessibility-contract.py

      - name: Commit source fix when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/ptyxis-window-dressing.c; then
            echo "No source commit required"
            exit 0
          fi
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ptyxis-window-dressing.c
          git diff --cached --check
          git commit -m "Fix Wardveil AT-SPI accessible semantics"
          git push origin HEAD:agent/wardveil-atspi-accessibility-fix
