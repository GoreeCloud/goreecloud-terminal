name: Native Version Contract

on:
  pull_request:
    paths:
      - 'native/meson.build'
      - 'native/data/goreecloud-terminal.metainfo.xml.in'
      - 'native/package-contract.json'
      - 'native/src/product-identity.h.in'
      - 'native/src/test-product-identity.c'
      - 'native/tools/render-product-main.py'
      - '.github/workflows/native-version-contract.yml'
  push:
    branches: [main]
    paths:
      - 'native/meson.build'
      - 'native/data/goreecloud-terminal.metainfo.xml.in'
      - 'native/package-contract.json'
      - 'native/src/product-identity.h.in'
      - 'native/src/test-product-identity.c'
      - 'native/tools/render-product-main.py'
      - '.github/workflows/native-version-contract.yml'

permissions:
  contents: read

jobs:
  version:
    name: Validate one native build/runtime/package version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf -y --setopt=install_weak_deps=False install \
            appstream \
            gcc \
            git \
            glib2-devel \
            gtk4-devel \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            python3 \
            vte291-gtk4-devel

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m py_compile native/tools/render-product-main.py
          python3 -m json.tool native/package-contract.json >/dev/null
          grep -Fq "product_version = meson.project_version()" native/meson.build
          grep -Fq "identity_config.set('PRODUCT_VERSION', product_version)" native/meson.build
          grep -Fq '#define GOREECLOUD_TERMINAL_VERSION "@PRODUCT_VERSION@"' native/src/product-identity.h.in
          grep -Fq '<release version="@PRODUCT_VERSION@"' native/data/goreecloud-terminal.metainfo.xml.in
          python3 - <<'PY'
          import json
          import pathlib

          contract = json.loads(pathlib.Path('native/package-contract.json').read_text())
          artifact = contract['artifact_identity']
          assert artifact == {
              'package_name': 'goreecloud-terminal',
              'install_prefix': '/usr',
              'version_authority': 'native/meson.build:project.version',
          }, artifact
          print('package-version-authority=native/meson.build:project.version')
          PY

      - name: Build and compare Development version surfaces
        shell: bash
        run: |
          set -euo pipefail
          build="$PWD/_native-version-development"
          stage="$PWD/_native-version-stage-development"
          meson setup "$build" native \
            --buildtype=debugoptimized \
            --prefix=/usr \
            -Dproduct_identity=development
          meson compile -C "$build"
          meson test -C "$build" --print-errorlogs
          DESTDIR="$stage" meson install -C "$build"
          metainfo="$stage/usr/share/metainfo/com.goreecloud.Terminal.Devel.metainfo.xml"
          appstreamcli validate "$metainfo"
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          build = pathlib.Path('_native-version-development')
          metainfo = pathlib.Path('_native-version-stage-development/usr/share/metainfo/com.goreecloud.Terminal.Devel.metainfo.xml')
          info = json.loads(subprocess.check_output(['meson', 'introspect', str(build), '--projectinfo'], text=True))
          version = info['version']
          header = (build / 'product-identity.h').read_text()
          rendered = (build / 'main-product-identity.c').read_text()
          metadata = metainfo.read_text()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version), version
          assert f'#define GOREECLOUD_TERMINAL_VERSION "{version}"' in header
          assert f'"version", "{version}",' in rendered
          assert f'<release version="{version}"' in metadata
          assert 'type="development"' in metadata
          assert '<id>com.goreecloud.Terminal.Devel</id>' in metadata
          print(f'development-version={version}')
          PY

      - name: Build and compare production identity version surfaces
        shell: bash
        run: |
          set -euo pipefail
          build="$PWD/_native-version-production"
          stage="$PWD/_native-version-stage-production"
          meson setup "$build" native \
            --buildtype=debugoptimized \
            --prefix=/usr \
            -Dproduct_identity=production
          meson compile -C "$build"
          meson test -C "$build" --print-errorlogs
          DESTDIR="$stage" meson install -C "$build"
          metainfo="$stage/usr/share/metainfo/com.goreecloud.Terminal.metainfo.xml"
          appstreamcli validate "$metainfo"
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          build = pathlib.Path('_native-version-production')
          metainfo = pathlib.Path('_native-version-stage-production/usr/share/metainfo/com.goreecloud.Terminal.metainfo.xml')
          info = json.loads(subprocess.check_output(['meson', 'introspect', str(build), '--projectinfo'], text=True))
          version = info['version']
          header = (build / 'product-identity.h').read_text()
          rendered = (build / 'main-product-identity.c').read_text()
          metadata = metainfo.read_text()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', version), version
          assert f'#define GOREECLOUD_TERMINAL_VERSION "{version}"' in header
          assert f'"version", "{version}",' in rendered
          assert f'<release version="{version}"' in metadata
          assert 'type="development"' in metadata
          assert '<id>com.goreecloud.Terminal</id>' in metadata
          assert 'com.goreecloud.Terminal.Devel' not in metadata
          print(f'production-identity-version={version}')
          PY
