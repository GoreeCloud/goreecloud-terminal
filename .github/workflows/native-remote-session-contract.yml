name: Native Remote Session Contract

on:
  push:
    branches:
      - main
      - agent/native-remote-session-contract-86
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-remote-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-contract:
    name: Validate native remote authorization boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"

      - name: Install focused build dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev

      - name: Validate remote authority separation
        shell: bash
        run: |
          set -euo pipefail
          test -f native/src/remote-session.h
          test -f native/src/remote-session.c
          test -f native/src/remote-openssh.h
          test -f native/src/remote-openssh.c
          test -f native/src/test-remote-session.c

          grep -Fq 'GOREE_TERMINAL_REMOTE_PURPOSE "remote_administration"' native/src/remote-session.h
          grep -Fq 'authority_verified' native/src/remote-session.h
          grep -Fq 'runtime_accepted' native/src/remote-session.h
          grep -Fq 'target_binding' native/src/remote-session.h
          grep -Fq 'GOREE_TERMINAL_REMOTE_PRIVACY_ALLOW_WITH_CONSTRAINTS' native/src/remote-session.c
          grep -Fq 'constraints_satisfied' native/src/remote-session.c
          grep -Fq 'GOREE_TERMINAL_REMOTE_BLOCKED' native/src/remote-session.c
          grep -Fq 'GOREE_TERMINAL_REMOTE_RECONNECTING' native/src/remote-session.c

          grep -Fq 'g_strdup("ssh")' native/src/remote-openssh.c
          ! grep -Fq 'StrictHostKeyChecking=no' native/src/remote-openssh.c
          ! grep -Fq 'ProxyCommand' native/src/remote-openssh.c
          ! grep -Fq 'IdentityFile' native/src/remote-openssh.c
          ! grep -Fq 'g_spawn_command_line' native/src/remote-openssh.c
          ! grep -Fq 'system(' native/src/remote-openssh.c

      - name: Build focused remote contract test
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -Wall -Wextra -Werror \
            $(pkg-config --cflags glib-2.0) \
            native/src/test-remote-session.c \
            native/src/remote-session.c \
            native/src/remote-openssh.c \
            $(pkg-config --libs glib-2.0) \
            -o /tmp/test-native-remote-session

      - name: Run focused remote contract test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/test-native-remote-session
