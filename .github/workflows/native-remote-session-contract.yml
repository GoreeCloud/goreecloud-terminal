name: Native Remote Session Contract

on:
  push:
    branches:
      - main
      - agent/native-remote-session-contract-86
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-remote-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-contract:
    name: Validate native remote authorization boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"

      - name: Install focused build dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libglib2.0-dev

      - name: Validate remote authority separation
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            native/src/remote-session.h \
            native/src/remote-session.c \
            native/src/remote-openssh.h \
            native/src/remote-openssh.c \
            native/src/remote-target-store.h \
            native/src/remote-target-store.c \
            native/src/remote-privacy-adapter.h \
            native/src/remote-privacy-adapter.c \
            native/src/test-remote-session.c \
            native/src/test-remote-target-store.c \
            native/src/test-remote-privacy-adapter.c; do
            test -f "$path"
          done

          grep -Fq 'GOREE_TERMINAL_REMOTE_PURPOSE "remote_administration"' native/src/remote-session.h
          grep -Fq 'authority_verified' native/src/remote-session.h
          grep -Fq 'runtime_accepted' native/src/remote-session.h
          grep -Fq 'target_binding' native/src/remote-session.h
          grep -Fq 'GOREE_TERMINAL_REMOTE_PRIVACY_ALLOW_WITH_CONSTRAINTS' native/src/remote-session.c
          grep -Fq 'constraints_satisfied' native/src/remote-session.c
          grep -Fq 'GOREE_TERMINAL_REMOTE_BLOCKED' native/src/remote-session.c
          grep -Fq 'GOREE_TERMINAL_REMOTE_RECONNECTING' native/src/remote-session.c

          grep -Fq 'g_strdup("ssh")' native/src/remote-openssh.c
          ! grep -Fq 'StrictHostKeyChecking=no' native/src/remote-openssh.c
          ! grep -Fq 'ProxyCommand' native/src/remote-openssh.c
          ! grep -Fq 'IdentityFile' native/src/remote-openssh.c
          ! grep -Fq 'g_spawn_command_line' native/src/remote-openssh.c
          ! grep -Fq 'system(' native/src/remote-openssh.c

          grep -Fq 'REMOTE_TARGET_FILE_NAME "remote-targets.ini"' native/src/remote-target-store.c
          grep -Fq 'g_chmod(path, 0600)' native/src/remote-target-store.c
          grep -Fq 'g_chmod(directory, 0700)' native/src/remote-target-store.c
          ! grep -Fq 'password=' native/src/remote-target-store.c
          ! grep -Fq 'token=' native/src/remote-target-store.c
          ! grep -Fq 'private-key' native/src/remote-target-store.c
          ! grep -Fq 'IdentityFile' native/src/remote-target-store.c
          ! grep -Fq 'ProxyCommand' native/src/remote-target-store.c

          grep -Fq 'GOREE_TERMINAL_REMOTE_PRIVACY_UNAVAILABLE' native/src/remote-privacy-adapter.c
          grep -Fq 'authority_verified = FALSE' native/src/remote-privacy-adapter.c
          grep -Fq 'runtime_accepted = FALSE' native/src/remote-privacy-adapter.c
          grep -Fq 'goree_terminal_remote_target_binding' native/src/remote-privacy-adapter.c

      - name: Build focused remote contract tests
        shell: bash
        run: |
          set -euo pipefail
          CFLAGS="-std=c17 -Wall -Wextra -Werror $(pkg-config --cflags glib-2.0)"
          LIBS="$(pkg-config --libs glib-2.0)"

          cc $CFLAGS \
            native/src/test-remote-session.c \
            native/src/remote-session.c \
            native/src/remote-openssh.c \
            $LIBS \
            -o /tmp/test-native-remote-session

          cc $CFLAGS \
            native/src/test-remote-target-store.c \
            native/src/remote-target-store.c \
            native/src/remote-session.c \
            $LIBS \
            -o /tmp/test-native-remote-target-store

          cc $CFLAGS \
            native/src/test-remote-privacy-adapter.c \
            native/src/remote-privacy-adapter.c \
            native/src/remote-session.c \
            $LIBS \
            -o /tmp/test-native-remote-privacy-adapter

      - name: Run focused remote contract tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/test-native-remote-session
          /tmp/test-native-remote-target-store
          /tmp/test-native-remote-privacy-adapter
