name: Native Host Session Contract

on:
  push:
    branches:
      - main
      - agent/native-glaze-ui-13
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-host-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-agent:
    name: Validate native host-session PTY agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"

      - name: Install host-agent build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc meson ninja-build python3

      - name: Validate narrow host-agent source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SO_PEERCRED' native/host-agent/main.c
          grep -Fq 'SCM_RIGHTS' native/host-agent/main.c
          grep -Fq 'openpty' native/host-agent/main.c
          grep -Fq 'TIOCSCTTY' native/host-agent/main.c
          grep -Fq 'GOREE_TERMINAL_HOST_PROTOCOL_VERSION' native/include/host-session-protocol.h
          grep -Fq 'host-agent.sock' native/include/host-session-protocol.h
          ! grep -Eq '\bAF_INET6?\b' native/host-agent/main.c
          ! grep -Fq 'org.freedesktop.Flatpak' native/host-agent/main.c native/include/host-session-protocol.h
          ! grep -Fq -- '--filesystem=host' native/host-agent/main.c native/include/host-session-protocol.h
          python3 -m py_compile native/host-agent/test-host-agent.py

      - name: Build host agent
        shell: bash
        run: |
          set -euo pipefail
          meson setup _host-agent-build native/host-agent --buildtype=debugoptimized
          meson compile -C _host-agent-build

      - name: Run host PTY integration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 native/host-agent/test-host-agent.py \
            _host-agent-build/goreecloud-terminal-host-agent

      - name: Verify runtime socket naming
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          trap 'rm -rf "$runtime_dir"' EXIT
          XDG_RUNTIME_DIR="$runtime_dir" \
            _host-agent-build/goreecloud-terminal-host-agent --print-socket \
            | grep -Fx "$runtime_dir/goreecloud-terminal/host-agent.sock"
