name: Flatpak Permission Contract

on:
  push:
    branches:
      - main
      - agent/flatpak-permission-minimization
      - agent/flatpak-no-host-filesystem-candidate
  pull_request:

permissions:
  contents: read

concurrency:
  group: flatpak-permission-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Flatpak permission review contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_MANIFEST: com.goreecloud.Terminal.Devel.NoHostFS.generated.json

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"

      - name: Validate permission review source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate-flatpak-permission-review.py
          python3 -m py_compile tools/generate-flatpak-permission-candidate.py
          python3 tools/validate-flatpak-permission-review.py

      - name: Validate isolated candidate derivation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_MANIFEST"
          python3 tools/generate-flatpak-permission-candidate.py --output "$CANDIDATE_MANIFEST"

          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          base = json.loads(Path('com.goreecloud.Terminal.Devel.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path(os.environ['CANDIDATE_MANIFEST']).read_text(encoding='utf-8'))
          removed = '--filesystem=host'

          assert candidate['finish-args'] == [arg for arg in base['finish-args'] if arg != removed]
          assert removed not in candidate['finish-args']

          restored = copy.deepcopy(candidate)
          restored['finish-args'] = copy.deepcopy(base['finish-args'])
          assert restored == base
          PY

          rm -f "$CANDIDATE_MANIFEST"
          test ! -e "$CANDIDATE_MANIFEST"

      - name: Validate review remains non-authoritative for Stable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path('release/flatpak-permission-review.json').read_text(encoding='utf-8'))
          status = json.loads(Path('release/status.json').read_text(encoding='utf-8'))
          experiment = review['experiments'][0]

          assert review['permission_set_minimized'] is False
          assert review['production_approved'] is False
          assert review['stable_approved'] is False
          assert experiment['ci_authoritative_for_stable'] is False
          assert experiment['production_approved'] is False
          assert experiment['stable_approved'] is False
          assert status['release_lifecycle'] == 'Release Candidate'
          assert status['production_approved'] is False
          assert status['stable_approved'] is False
          assert any(
              'Flatpak permission minimization' in blocker
              for blocker in status['stable_blockers']
          ), 'current lifecycle must retain a Flatpak permission-minimization blocker'
          PY

      - name: Validate documentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Permission minimization is not complete' docs/flatpak-permission-minimization.md
          grep -Fq 'highest-priority minimization candidate' docs/flatpak-permission-minimization.md
          grep -Fq 'Development-only no-host-filesystem candidate' docs/flatpak-permission-minimization.md
          grep -Fq 'canonical production and development manifests remain unchanged' docs/flatpak-permission-minimization.md
          grep -Fq 'do not prove that the current manifest is minimized' docs/flatpak-permission-minimization.md
          grep -Fq 'permission-minimization contract' docs/flatpak-packaging-and-acceptance.md
