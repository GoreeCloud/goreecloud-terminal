name: Apply Wardveil Accessibility Follow-up

on:
  push:
    branches:
      - agent/wardveil-atspi-accessibility-fix
    paths:
      - .github/workflows/wardveil-accessibility-followup.yml

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: agent/wardveil-atspi-accessibility-fix
          fetch-depth: 0

      - name: Apply second accessibility design
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          window_path = Path('src/ptyxis-window-dressing.c')
          test_path = Path('tools/test-wardveil-accessibility-contract.py')
          doc_path = Path('docs/wardveil-atspi-accessibility-fix.md')

          window = window_path.read_text(encoding='utf-8')
          old_update = '''  gtk_accessible_update_property (GTK_ACCESSIBLE (self->session_context_chip),
                                          GTK_ACCESSIBLE_PROPERTY_LABEL,
                                          context->accessible_description,
                                          -1);
'''
          new_update = '''  if (context->accessible_description != NULL)
    gtk_accessible_update_property (GTK_ACCESSIBLE (self->session_context_label),
                                    GTK_ACCESSIBLE_PROPERTY_LABEL,
                                    context->accessible_description,
                                    -1);
  else
    gtk_accessible_reset_property (GTK_ACCESSIBLE (self->session_context_label),
                                   GTK_ACCESSIBLE_PROPERTY_LABEL);
'''
          if window.count(old_update) != 1:
              raise SystemExit('expected exactly one existing chip accessible-label mapping')
          window = window.replace(old_update, new_update)

          old_label = '''  self->session_context_label = GTK_LABEL (g_object_new (GTK_TYPE_LABEL,
                                                                 "accessible-role", GTK_ACCESSIBLE_ROLE_NONE,
                                                                 NULL));
'''
          new_label = '''  self->session_context_label = GTK_LABEL (g_object_new (GTK_TYPE_LABEL,
                                                       "accessible-role", GTK_ACCESSIBLE_ROLE_LABEL,
                                                       NULL));
'''
          if window.count(old_label) != 1:
              raise SystemExit('expected exactly one non-semantic Wardveil label constructor')
          window = window.replace(old_label, new_label)

          old_chip = '''  self->session_context_chip = g_object_new (GTK_TYPE_BOX,
                                              "accessible-role", GTK_ACCESSIBLE_ROLE_GROUP,
                                              "orientation", GTK_ORIENTATION_HORIZONTAL,
                                              "spacing", 6,
                                              "valign", GTK_ALIGN_CENTER,
                                              NULL);
'''
          new_chip = '''  self->session_context_chip = g_object_new (GTK_TYPE_BOX,
                                            "accessible-role", GTK_ACCESSIBLE_ROLE_GENERIC,
                                            "orientation", GTK_ORIENTATION_HORIZONTAL,
                                            "spacing", 6,
                                            "valign", GTK_ALIGN_CENTER,
                                            NULL);
'''
          if window.count(old_chip) != 1:
              raise SystemExit('expected exactly one semantic-group Wardveil chip constructor')
          window = window.replace(old_chip, new_chip)
          window_path.write_text(window, encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          old_contract = '''    require_count(
        window,
        '\"accessible-role\", GTK_ACCESSIBLE_ROLE_GROUP',
        1,
        "semantic group role on Wardveil session-context chip",
    )
    require_count(
        window,
        '\"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE',
        2,
        "non-semantic decorative child roles",
    )
    require(
        window,
        "GTK_ACCESSIBLE_PROPERTY_LABEL,\\n                                  context->accessible_description",
        "accessible label mapping",
    )
'''
          new_contract = '''    require_count(
        window,
        '\"accessible-role\", GTK_ACCESSIBLE_ROLE_GENERIC',
        1,
        "generic layout role on Wardveil session-context container",
    )
    require_count(
        window,
        '\"accessible-role\", GTK_ACCESSIBLE_ROLE_LABEL',
        1,
        "semantic role on visible Wardveil text label",
    )
    require_count(
        window,
        '\"accessible-role\", GTK_ACCESSIBLE_ROLE_NONE',
        1,
        "non-semantic decorative icon role",
    )
    require(
        window,
        "gtk_accessible_update_property (GTK_ACCESSIBLE (self->session_context_label),\\n                                    GTK_ACCESSIBLE_PROPERTY_LABEL,\\n                                    context->accessible_description",
        "accessible description mapped to semantic visible label",
    )
    require(
        window,
        "gtk_accessible_reset_property (GTK_ACCESSIBLE (self->session_context_label),\\n                                   GTK_ACCESSIBLE_PROPERTY_LABEL)",
        "accessible label reset for Local/unknown context",
    )
'''
          if test.count(old_contract) != 1:
              raise SystemExit('expected exactly one existing source-contract role block')
          test = test.replace(old_contract, new_contract)
          test_path.write_text(test, encoding='utf-8')

          doc = doc_path.read_text(encoding='utf-8')
          old_doc = '''## Corrective contract

The session-context chip must:

- remain a non-actionable, read-only presentation element;
- use a semantic accessible group role for the icon-plus-label grouping;
- expose the exact context description (`Remote terminal session`, `Containerized terminal session`, or `Elevated superuser terminal session`) as the group accessible label;
- keep the visible text-plus-icon presentation so context is not conveyed by color alone;
- mark purely decorative child presentation as non-semantic where practical so assistive technologies do not announce duplicate content;
- keep Local/unknown context hidden and free of a misleading Wardveil protection claim;
- preserve normal terminal rendering, VTE palette ownership, keyboard focus order, OpenSSH, sudo, and shell behavior.
'''
          new_doc = '''## Corrective contract

The first corrective candidate used a semantic `GROUP` container and marked both visible children `NONE`. Live supported-workstation AT-SPI verification still failed to expose `Remote terminal session`, so that design is rejected.

The revised session-context accessibility contract must:

- remain a non-actionable, read-only presentation element;
- keep the `GtkBox` as a generic layout container rather than making the container the semantic announcement target;
- keep the symbolic `GtkImage` non-semantic because it is decorative duplication of the visible context text;
- expose the visible `GtkLabel` with `GTK_ACCESSIBLE_ROLE_LABEL`;
- override that semantic label's accessible name with the exact context description (`Remote terminal session`, `Containerized terminal session`, or `Elevated superuser terminal session`) while leaving its visible text concise (`Remote`, `Container`, or `Elevated`);
- reset the explicit accessible label when Local/unknown context is active and keep the entire chip hidden so Local does not make a Wardveil protection claim;
- keep the visible text-plus-icon presentation so context is not conveyed by color alone;
- preserve normal terminal rendering, VTE palette ownership, keyboard focus order, OpenSSH, sudo, and shell behavior.
'''
          if doc.count(old_doc) != 1:
              raise SystemExit('expected exactly one existing corrective-contract section')
          doc = doc.replace(old_doc, new_doc)
          doc_path.write_text(doc, encoding='utf-8')
          PY

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-wardveil-accessibility-contract.py
          git diff --check

      - name: Commit revised correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wardveil-accessibility-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ptyxis-window-dressing.c tools/test-wardveil-accessibility-contract.py docs/wardveil-atspi-accessibility-fix.md .github/workflows/wardveil-accessibility-followup.yml
          git commit -m 'Revise Wardveil AT-SPI semantics after runtime failure'
          git push origin HEAD:agent/wardveil-atspi-accessibility-fix
