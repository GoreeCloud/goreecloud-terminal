name: Native Foundation Contract

on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/testing/native-workstation-acceptance.sh'
      - '.github/workflows/native-foundation-contract.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/testing/native-workstation-acceptance.sh'
      - '.github/workflows/native-foundation-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify isolated native foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f native/src/main.c
          test -f native/src/session-lifecycle.c
          test -f native/src/session-lifecycle.h
          test -f native/src/test-session-lifecycle.c
          test -f native/src/glaze-contract.c
          test -f native/src/glaze-contract.h
          test -f native/src/test-glaze-contract.c
          test -f native/src/theme-engine.c
          test -f native/src/theme-engine.h
          test -f native/src/test-theme-engine.c
          test -f native/data/glaze-ui.css
          test -f native/data/glaze-ui-manifest.json
          test -f native/data/goreecloud-terminal-native.gresource.xml
          test -f native/tools/validate-glaze-contract.py
          test -f native/GLAZE_UI_13.md
          test -f native/meson.build
          test -f native/README.md
          test -f scripts/testing/native-workstation-acceptance.sh
          bash -n scripts/testing/native-workstation-acceptance.sh
          grep -Fq -- '--automated-only' scripts/testing/native-workstation-acceptance.sh
          grep -Fq 'XDG_CONFIG_HOME="${config_dir}"' scripts/testing/native-workstation-acceptance.sh
          grep -Fq 'mode=deep-dark' scripts/testing/native-workstation-acceptance.sh
          grep -Fq 'com.goreecloud.Terminal.Native' native/src/main.c
          grep -Fq "dependency('gtk4'" native/meson.build
          grep -Fq "dependency('vte-2.91-gtk4'" native/meson.build
          grep -Fq "test('native-session-lifecycle'" native/meson.build
          grep -Fq "test('native-glaze-contract'" native/meson.build
          grep -Fq "test('native-theme-engine'" native/meson.build
          grep -Fq 'GOREE_TERMINAL_GLAZE_VERSION "1.3.0"' native/src/glaze-contract.h
          grep -Fq '"deep-dark"' native/src/theme-engine.c
          grep -Fq 'GOREE_TERMINAL_THEME_SETTINGS_PATH' native/src/theme-engine.c
          grep -Fq 'g_get_user_config_dir()' native/src/theme-engine.c
          grep -Fq 'mode=deep-dark' native/src/test-theme-engine.c
          grep -Fq '/theme/persistence' native/src/test-theme-engine.c
          grep -Fq '/theme/invalid-persistence-fails-safe' native/src/test-theme-engine.c
          grep -Fq 'g_menu_append(edit, "Clear", "terminal.clear")' native/src/main.c
          grep -Fq 'vte_terminal_feed(VTE_TERMINAL(user_data), "\033[2J\033[H", -1)' native/src/main.c
          if grep -Fn 'sudo apt update' native/src/main.c; then
            echo 'Native GoreeCloud Terminal must not expose sudo apt update as a product action or context-menu item.' >&2
            exit 1
          fi
          if grep -RIE '(^|["<])(ptyxis|org\.gnome\.Ptyxis)' native/src native/meson.build; then
            echo 'Native product source must not import or identify as Ptyxis.' >&2
            exit 1
          fi
      - name: Validate Glaze adoption metadata
        run: python3 native/tools/validate-glaze-contract.py

  native-build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf -y --setopt=install_weak_deps=False install \
            gcc \
            git \
            glib2-devel \
            gtk4-devel \
            meson \
            ninja-build \
            pkgconf-pkg-config \
            python3 \
            vte291-gtk4-devel
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run automated laptop acceptance path
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/testing/native-workstation-acceptance.sh --automated-only
